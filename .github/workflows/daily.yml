name: MetalRadr daily check

on:
  schedule:
    # Fires twice to cover 7am Sydney across both AEST (UTC+10) and AEDT
    # (UTC+11) without needing manual cron changes at DST transitions.
    # main.py itself checks the actual Sydney-local hour and no-ops the
    # run that doesn't land on 7am, so only one of these does anything.
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" trigger from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MetalRadr
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "MetalRadr bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update state.json [skip ci]"
          git push
