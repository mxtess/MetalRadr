# MetalRadr configuration
# Edit this file to change what you're tracked for. No code changes needed.

venues:
  - name: "Hordern Pavilion"
    url: "https://thehordern.com.au/event/"
    event_link_pattern: "/event/"

  - name: "Metro Theatre"
    url: "https://www.metrotheatre.com.au/event/"
    event_link_pattern: "/event/"

  - name: "Enmore Theatre"
    url: "https://www.enmoretheatre.com.au/event/"
    event_link_pattern: "/event/"

  - name: "Afterpay Arena"
    # Rebranded from Qudos Bank Arena — qudosbankarena.com.au now
    # 301-redirects here. The venue's own "/upcoming-events" page is a
    # news/blog listing, not the real event list; "/event-calendar" is
    # the actual events page, with clean /event/<slug> links per show.
    url: "https://afterpayarena.com.au/event-calendar"
    event_link_pattern: "/event/"
    # Hosts sports + family shows too, so lean harder on artist/genre
    # keyword matching for this source specifically.
    keyword_filter_required: true

  - name: "Roundhouse"
    # UNSW/Arc site, not one of the Century Venues Group ones — its real
    # event links are /roundhouse/events/<slug>, not /event/.
    url: "https://www.arc.unsw.edu.au/roundhouse/whats-on"
    event_link_pattern: "/roundhouse/events/"
    # Multi-purpose student union venue — the listing itself mixes gigs
    # and DJ nights with non-music events like "Bingo Loco" (a party
    # bingo game night), so lean harder on artist/genre keyword matching
    # for this source specifically, same as Afterpay Arena.
    keyword_filter_required: true

promoters:
  - name: "Destroy All Lines"
    url: "https://www.destroyalllines.com/tours"
    event_link_pattern: "/tours/"

  - name: "Handsome Tours"
    url: "https://www.handsometours.com/tours"
    event_link_pattern: "/tours/"
    # Placeholder URL — verify against the live site before enabling;
    # Handsome Tours' site structure wasn't directly inspected during setup.
    enabled: false

# Artists you want alerts for regardless of which Sydney venue they play.
# Matching is case-insensitive substring match against event titles.
artists:
  - "Tame Impala"
  # Add more artists here, one per line.

# Broader genre net. Checked two ways for any event that doesn't already
# match via venue/artist: first as a literal keyword in the event title
# (fast, but misses acts whose name doesn't contain a genre word, e.g.
# "Avenged Sevenfold"), then — only if that misses — via a MusicBrainz
# artist lookup matched against this same list (see musicbrainz_client.py
# / matching.matches_genre_via_musicbrainz).
genres:
  - "metal"
  - "heavy metal"
  - "alternative metal"
  - "metalcore"
  - "deathcore"
  - "groove metal"
  - "progressive metal"
  - "gothic metal"
  - "industrial metal"
  - "rock"
  - "alternative rock"
  - "hard rock"
  - "indie rock"
  - "garage rock"
  - "grunge"
  - "punk rock"
  - "hardcore punk"
  - "post-punk"
  - "indie pop"
  - "indietronica"
  - "electropop"
  - "synth-pop"
  - "dream pop"
  - "shoegaze"
  - "electronic"
  - "electro house"
  - "house"
  - "french house"
  - "nu-disco"
  - "electroclash"
  - "electronic rock"
  - "emo"
  - "math rock"
  - "industrial"
  - "gothic rock"

# Dedup: collapse multiple dates from the same artist within this many days
# into a single alert (e.g. Tame Impala playing 3 nights in November).
dedup_window_days: 30

# Storage of previously-seen events, so we don't re-alert daily.
state_file: "state.json"
